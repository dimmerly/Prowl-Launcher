name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests/Prowl.Launcher.Test.csproj

      - name: Build
        run: dotnet build tests/Prowl.Launcher.Test.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Prowl.Launcher.Test.csproj -c Release --no-build --filter Category!=E2E

      - name: Prepare Linux graphics
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglfw3 libxrandr2 libxinerama1 libxcursor1 libxi6

      - name: Prepare Windows software OpenGL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/setup-windows-opengl.ps1

      - name: Test rendered UI workflows
        shell: bash
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          PROWL_E2E_ARTIFACTS: ${{ runner.temp }}/ProwlLauncherE2E
        run: |
          test_command=(dotnet test tests/Prowl.Launcher.Test.csproj -c Release --no-build --filter Category=E2E --logger 'trx;LogFileName=e2e.trx' --results-directory artifacts/test-results)
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "${test_command[@]}"
          else
            "${test_command[@]}"
          fi

      - name: Upload UI failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-diagnostics-${{ matrix.runner }}
          path: |
            artifacts/test-results
            ${{ runner.temp }}/ProwlLauncherE2E
          if-no-files-found: ignore
