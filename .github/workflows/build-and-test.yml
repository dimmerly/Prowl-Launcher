name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Prowl.Launcher.Test/Prowl.Launcher.Test.csproj

      - name: Build
        run: dotnet build Prowl.Launcher.Test/Prowl.Launcher.Test.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Prowl.Launcher.Test/Prowl.Launcher.Test.csproj -c Release --no-build
