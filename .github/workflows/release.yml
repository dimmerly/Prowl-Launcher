name: Build and release

on:
  push:
    branches: [main]
    paths: [VERSION.txt]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      engine: ${{ steps.version.outputs.engine }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read versions
        id: version
        run: |
          version=$(tr -d '\r' < VERSION.txt)
          engine=$(tr -d '\r' < EngineRevision.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "VERSION.txt must contain a semantic version such as 1.0.0."
            exit 1
          fi
          if [[ ! "$engine" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EngineRevision.txt must contain a full Prowl commit SHA."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | .tag_name")
          if [ -n "$existing" ]; then
            echo "v$VERSION is already published; skipping builds and release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: github.event_name == 'pull_request' || needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: ubuntu-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: osx-x64
            runner: macos-15-intel
          - platform: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ProwlEngine/Prowl
          ref: ${{ needs.prepare.outputs.engine }}
          path: Engine
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build sample bundles
        run: >
          dotnet msbuild Samples/Samples.proj -t:Build
          -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.platform }}
          -p:SampleOutputRoot=${{ github.workspace }}/artifacts/samples/

      - name: Publish launcher
        run: >
          dotnet publish Prowl.Launcher/Prowl.Launcher.csproj
          -c Release -r ${{ matrix.platform }} --self-contained true
          -p:SelfInstall=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          -p:SampleBundleDirectory=${{ github.workspace }}/artifacts/samples/Bundles
          -o "publish/Prowl Launcher"

      - name: Include Linux ARM64 GLFW library
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3
          cp -L /usr/lib/aarch64-linux-gnu/libglfw.so.3 "publish/Prowl Launcher/libglfw.so.3"

      - name: Prepare AppImage tool
        if: startsWith(matrix.platform, 'linux-')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = linux-arm64 ]; then
            arch=aarch64
            digest=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          else
            arch=x86_64
            digest=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          fi
          tool="$RUNNER_TEMP/appimagetool.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage" -o "$tool"
          echo "$digest  $tool" | sha256sum --check
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Package launcher
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: >
          dotnet run --file .github/scripts/package-launcher.cs --
          "publish/Prowl Launcher" "$PLATFORM" "$VERSION"
          "artifacts/Prowl Launcher-$VERSION-$PLATFORM.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launcher-${{ matrix.platform }}
          path: artifacts/Prowl Launcher-*
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published; bump VERSION.txt to release an update."
            exit 0
          fi

          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$existing" != "$SOURCE_SHA" ]; then
              echo "$tag points to another commit; refusing to replace it."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA"
          fi

          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" artifacts/* --verify-tag \
            --title "Prowl Launcher $VERSION" --generate-notes "${flags[@]}"
