name: Build and release

on:
  push:
    branches: [main]
    paths: [VERSION.txt]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/build-and-test.yml

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      engine: ${{ steps.version.outputs.engine }}
      publish: ${{ steps.release.outputs.publish }}
      signing: ${{ steps.version.outputs.signing }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read versions
        id: version
        env:
          SIGN_PRERELEASES: ${{ vars.SIGN_PRERELEASES }}
        run: |
          version=$(tr -d '\r' < VERSION.txt)
          engine=$(tr -d '\r' < EngineRevision.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "VERSION.txt must contain a semantic version such as 1.0.0."
            exit 1
          fi
          if [[ ! "$engine" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EngineRevision.txt must contain a full Prowl commit SHA."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          release_version=${version%%+*}
          if [[ "$release_version" != *-* ]] || [[ "$SIGN_PRERELEASES" == true ]]; then
            echo 'signing=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signing=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing release
        id: release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          existing=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v$VERSION\") | .tag_name")
          if [ -n "$existing" ]; then
            echo "v$VERSION is already published; skipping builds and release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare, test]
    if: github.event_name == 'pull_request' || needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-latest
          - platform: linux-x64
            runner: ubuntu-latest
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: osx-x64
            runner: macos-15-intel
          - platform: osx-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ProwlEngine/Prowl
          ref: ${{ needs.prepare.outputs.engine }}
          path: Engine
          submodules: true
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check release signing credentials
        if: needs.prepare.outputs.signing == 'true' && !startsWith(matrix.platform, 'linux-')
        env:
          PLATFORM: ${{ matrix.platform }}
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$PLATFORM" == win-* ]]; then
            : "${WINDOWS_SIGNING_CERTIFICATE:?Configure Windows release signing credentials; see docs/release-signing.md}"
            : "${WINDOWS_SIGNING_PASSWORD:?Configure the Windows signing certificate password}"
          else
            : "${MACOS_SIGNING_CERTIFICATE:?Configure Developer ID signing credentials; see docs/release-signing.md}"
            : "${MACOS_SIGNING_PASSWORD:?Configure the Developer ID certificate password}"
            : "${APPLE_NOTARY_KEY:?Configure the App Store Connect API private key}"
            : "${APPLE_NOTARY_KEY_ID:?Configure the App Store Connect API key ID}"
            : "${APPLE_NOTARY_ISSUER_ID:?Configure the App Store Connect API issuer ID}"
          fi

      - name: Include Linux ARM64 GLFW library in samples
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3

      - name: Package downloadable samples
        run: >
          dotnet run --file .github/scripts/package-samples.cs --
          Engine artifacts/samples ${{ matrix.platform }}
          artifacts/Prowl-Samples-${{ matrix.platform }}.zip

      - name: Test downloadable sample bundle
        env:
          PROWL_SAMPLE_BUNDLE: ${{ github.workspace }}/artifacts/Prowl-Samples-${{ matrix.platform }}.zip
        run: >
          dotnet test tests/Prowl.Launcher.Test.csproj
          -c Release -r ${{ matrix.platform }}
          --filter Category!=E2E
          "-p:SampleCatalogFile=${{ github.workspace }}/artifacts/samples/samples.json"

      - name: Publish launcher
        run: >
          dotnet publish src/Prowl.Launcher.csproj
          -c Release -r ${{ matrix.platform }} --self-contained true
          -p:SelfInstall=true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false
          "-p:SampleCatalogFile=${{ github.workspace }}/artifacts/samples/samples.json"
          -o "publish/Prowl Launcher"

      - name: Publish update files
        run: >
          dotnet publish src/Prowl.Launcher.csproj
          -c Release -r ${{ matrix.platform }} --self-contained true
          -p:SelfInstall=false -p:PublishSingleFile=false
          -p:DebugType=None -p:DebugSymbols=false
          "-p:SampleCatalogFile=${{ github.workspace }}/artifacts/samples/samples.json"
          -o "publish-updates/Prowl Launcher"

      - name: Include Linux ARM64 GLFW library
        if: matrix.platform == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglfw3
          cp -L /usr/lib/aarch64-linux-gnu/libglfw.so.3 "publish/Prowl Launcher/libglfw.so.3"
          cp -L /usr/lib/aarch64-linux-gnu/libglfw.so.3 "publish-updates/Prowl Launcher/libglfw.so.3"

      - name: Prepare AppImage tool
        if: startsWith(matrix.platform, 'linux-')
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = linux-arm64 ]; then
            arch=aarch64
            digest=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
          else
            arch=x86_64
            digest=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          fi
          tool="$RUNNER_TEMP/appimagetool.AppImage"
          curl --fail --location --retry 3 \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage" -o "$tool"
          echo "$digest  $tool" | sha256sum --check
          chmod +x "$tool"
          echo "APPIMAGETOOL=$tool" >> "$GITHUB_ENV"

      - name: Sign Windows launcher and update files
        if: matrix.platform == 'win-x64' && needs.prepare.outputs.signing == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: >
          ./.github/scripts/sign-windows.ps1 -Files @(
          'publish/Prowl Launcher/Prowl.Launcher.exe',
          'publish-updates/Prowl Launcher/Prowl.Launcher.exe',
          'publish-updates/Prowl Launcher/Prowl.Launcher.dll')

      - name: Prepare Developer ID signing and notarization
        if: startsWith(matrix.platform, 'osx-') && needs.prepare.outputs.signing == 'true'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash .github/scripts/setup-macos-signing.sh

      - name: Package launcher
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          PROWL_REQUIRE_SIGNING: ${{ needs.prepare.outputs.signing }}
        run: >
          dotnet run --file .github/scripts/package-launcher.cs --
          "publish/Prowl Launcher" "publish-updates/Prowl Launcher" "$PLATFORM" "$VERSION"
          "artifacts/Prowl-Launcher-$VERSION-$PLATFORM.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.platform }}
          path: |
            artifacts/Prowl-Launcher-*
            artifacts/Prowl-Samples-*.zip
          if-no-files-found: error

      - name: Remove the temporary signing keychain
        if: always() && runner.os == 'macOS' && env.PROWL_SIGNING_WORK != ''
        run: |
          security delete-keychain "$PROWL_MAC_KEYCHAIN" || true
          case "$PROWL_SIGNING_WORK" in
            "$RUNNER_TEMP"/prowl-signing.*) rm -rf -- "$PROWL_SIGNING_WORK" ;;
            *) echo 'Refusing to remove an unexpected signing directory.' >&2; exit 1 ;;
          esac

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.prepare.outputs.publish == 'true'
    needs: [prepare, test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag and publish new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already published; bump VERSION.txt to release an update."
            exit 0
          fi

          if existing=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            if [ "$existing" != "$SOURCE_SHA" ]; then
              echo "$tag points to another commit; refusing to replace it."
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$SOURCE_SHA"
          fi

          flags=()
          release_version=${VERSION%%+*}
          if [[ "$release_version" == *-* ]]; then flags+=(--prerelease); fi

          assets=()
          for file in artifacts/*; do
            name=$(basename "$file")
            if [[ "$name" == *.zip ]]; then
              assets+=("$file")
              continue
            fi
            platform=${name#Prowl-Launcher-$VERSION-}
            platform=${platform%.*}
            case "$platform" in
              win-x64) label="Prowl Launcher for Windows (x64)" ;;
              linux-x64) label="Prowl Launcher for Linux (x64)" ;;
              linux-arm64) label="Prowl Launcher for Linux (ARM64)" ;;
              osx-x64) label="Prowl Launcher for macOS (Intel)" ;;
              osx-arm64) label="Prowl Launcher for macOS (Apple Silicon)" ;;
              *) echo "Unexpected release asset: $name"; exit 1 ;;
            esac
            assets+=("$file#$label.${name##*.}")
          done

          gh release create "$tag" "${assets[@]}" --verify-tag \
            --title "Prowl Launcher $VERSION" --generate-notes "${flags[@]}"
